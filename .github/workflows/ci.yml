name: Spring Boot CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gameflix_db
          MYSQL_USER: gameflix_ci
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/gameflix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate JWT secret for CI tests
        shell: bash
        run: |
          echo "GAMEFLIX_JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build and test with Maven
        run: mvn --batch-mode clean package

      - name: Build Docker image
        run: docker build -t gameflix-backend:latest .

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: gameflix-backend:latest
          syft-version: v1.54.1
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.1
          cache: true

      - name: Report HIGH and CRITICAL vulnerabilities
        shell: bash
        run: |
          trivy image --timeout 30m --image-src docker \
            --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile /dev/null --exit-code 0 --format json \
            --output trivy-high-critical.json gameflix-backend:latest
          trivy convert --format table --ignorefile /dev/null \
            --output trivy-high-critical.txt trivy-high-critical.json

      - name: Fail build on any CRITICAL vulnerability
        shell: bash
        run: |
          trivy convert --format table --severity CRITICAL \
            --ignorefile /dev/null --exit-code 1 trivy-high-critical.json

      - name: Save SBOM and vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gameflix-security-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            sbom.cdx.json
            trivy-high-critical.json
            trivy-high-critical.txt
          if-no-files-found: error