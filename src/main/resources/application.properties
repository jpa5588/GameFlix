spring.application.name=GameFlix

# DATASOURCE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/gameflix_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

# JPA / HIBERNATE PROPERTIES
# Hibernate 6 (Spring Boot 3) automatically detects the best dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE

# Load the settings from my local configuration file.
spring.config.import=classpath:application-local.properties

# GameFlix creates the tokens.
gameflix.jwt.issuer=gameflix

# These tokens are meant for the GameFlix API.
gameflix.jwt.audience=gameflix-api

# Tokens expire after 15 minutes.
gameflix.jwt.expiration-seconds=900
